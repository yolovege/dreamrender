<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dreamrender</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
  }
  #caption, #nogl {
    position: fixed; left: 50%; transform: translateX(-50%);
    width: min(92vw, 60em); text-align: center; color: #fff;
    font: 600 clamp(14px, 3.6vw, 30px)/1.4 "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    text-shadow: 0 0 4px #000, 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000;
    pointer-events: none;
  }
  #caption {
    bottom: max(6vh, env(safe-area-inset-bottom));
    opacity: 0; transition: opacity 0.6s;
  }
  #caption.on { opacity: 1; }
  #nogl { top: 45%; }
  #fps {
    position: fixed; top: 8px; left: 8px; padding: 2px 6px;
    font: 12px/1.4 monospace; color: #0f0; background: rgba(0, 0, 0, 0.6);
  }
  [hidden] { display: none; }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="caption" aria-live="polite"></div>
<div id="fps" hidden></div>
<div id="nogl" hidden>這個瀏覽器不支援 WebGL，沒辦法作夢。</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
