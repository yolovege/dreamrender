<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>dreamrender</title>
<meta name="description" content="一句沒有意義的話，配一張像舊錄影帶的夢。">
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    image-rendering: pixelated;
  }
  #caption {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: max(6vh, env(safe-area-inset-bottom));
    width: min(92vw, 60em); text-align: center; color: #fff;
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    text-shadow: 0 0 4px #000, 0 2px 0 #000, 2px 0 0 #000, 0 -2px 0 #000, -2px 0 0 #000;
    pointer-events: none; opacity: 0; transition: opacity 0.6s;
    text-wrap: balance;
  }
  #caption.on { opacity: 1; }
  #zh { font-size: clamp(14px, 3.6vw, 30px); font-weight: 600; line-height: 1.4; }
  #en { font-size: clamp(12px, 2.4vw, 20px); font-weight: 500; line-height: 1.35; margin-top: 0.25em; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="caption" aria-live="polite"><div id="zh" lang="zh-Hant"></div><div id="en" lang="en"></div></div>
<script type="module" src="./src/slideshow.js"></script>
</body>
</html>
